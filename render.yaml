# Render Blueprint — static site.
# Render runs the generator, then serves ./public.
services:
  - type: web
    name: jggl-site
    runtime: static
    buildCommand: npm run build
    staticPublishPath: ./public
    pullRequestPreviewsEnabled: false
    headers:
      # Fingerprint-free filenames, so keep the HTML always revalidated
      # and let the immutable assets cache hard.
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
